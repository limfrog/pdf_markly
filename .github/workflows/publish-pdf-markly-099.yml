name: Publish PDF Markly 0.9.9 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pdf-markly-099.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.9.9 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.9.9 >/dev/null 2>&1; then
            echo "v0.9.9 release already exists"
          else
            gh release create v0.9.9 --target "$GITHUB_SHA" --title "PDF Markly 0.9.9" --notes "PDF Markly 0.9.9: developer/contact information updated to Horizon Entertainment and apps@horizonent.co.kr; privacy policy and terms pages added."
          fi
