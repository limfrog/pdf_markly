name: Publish PDF Markly 0.9.10 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pdf-markly-0910.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.9.10 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.9.10 >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create v0.9.10 --target "$GITHUB_SHA" --title "PDF Markly 0.9.10" --notes "Adds a Picture Open menu with new-page background import and current-page editable image insertion. Existing drag-and-drop behaviors are preserved."
          fi
